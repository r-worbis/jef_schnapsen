<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Schnapsen-Kartenvorschau</title>
  <style>
    body { font: 16px/1.4 Georgia, serif; background: #1e3d2f; color: #f3ead7; margin: 24px; }
    h1 { font-size: 1.4rem; }
    p { max-width: 40em; }
    .pack { display: flex; flex-wrap: wrap; gap: 12px; }
    figure { margin: 0; width: 120px; text-align: center; }
    figcaption { margin-top: 6px; font-size: 0.85rem; }
    img { width: 110px; height: auto; background: #fff; border-radius: 8px; }
  </style>
</head>

    <figure><img src="Herz-Bube.svg" alt="Herz-Bube"><figcaption>Herz-Bube</figcaption></figure>
    <figure><img src="Karo-Ass.svg" alt="Karo-Ass"><figcaption>Karo-Ass</figcaption></figure>
    <figure><img src="Karo-Zehner.svg" alt="Karo-Zehner"><figcaption>Karo-Zehner</figcaption></figure>
    <figure><img src="Karo-König.svg" alt="Karo-König"><figcaption>Karo-König</figcaption></figure>
    <figure><img src="Karo-Dame.svg" alt="Karo-Dame"><figcaption>Karo-Dame</figcaption></figure>
    <figure><img src="Karo-Bube.svg" alt="Karo-Bube"><figcaption>Karo-Bube</figcaption></figure>
    <figure><img src="Pik-Ass.svg" alt="Pik-Ass"><figcaption>Pik-Ass</figcaption></figure>
    <figure><img src="Pik-Zehner.svg" alt="Pik-Zehner"><figcaption>Pik-Zehner</figcaption></figure>
    <figure><img src="Pik-König.svg" alt="Pik-König"><figcaption>Pik-König</figcaption></figure>
    <figure><img src="Pik-Dame.svg" alt="Pik-Dame"><figcaption>Pik-Dame</figcaption></figure>

</html>
